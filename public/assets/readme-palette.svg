<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="150" fill="#14110f"/>

  <g font-family="'JetBrains Mono', ui-monospace, monospace">
    <!-- void -->
    <rect x="20" y="20" width="160" height="64" rx="12" fill="#0a0908" stroke="#f5efe7" stroke-opacity="0.10"/>
    <text x="20" y="106" font-size="12" letter-spacing="1.5" fill="#f5efe7">VOID</text>
    <text x="20" y="122" font-size="10" fill="#8a8276">#0a0908</text>

    <!-- surface -->
    <rect x="220" y="20" width="160" height="64" rx="12" fill="#1d1916" stroke="#f5efe7" stroke-opacity="0.10"/>
    <text x="220" y="106" font-size="12" letter-spacing="1.5" fill="#f5efe7">SURFACE</text>
    <text x="220" y="122" font-size="10" fill="#8a8276">#1d1916</text>

    <!-- bone -->
    <rect x="420" y="20" width="160" height="64" rx="12" fill="#f5efe7"/>
    <text x="420" y="106" font-size="12" letter-spacing="1.5" fill="#f5efe7">BONE</text>
    <text x="420" y="122" font-size="10" fill="#8a8276">#f5efe7</text>

    <!-- accent - the one true color, Swiggy's own -->
    <rect x="620" y="20" width="160" height="64" rx="12" fill="#FC8019"/>
    <circle cx="632" cy="32" r="3.5" fill="#0a0908"/>
    <text x="620" y="106" font-size="12" letter-spacing="1.5" fill="#f5efe7">ACCENT</text>
    <text x="620" y="122" font-size="10" fill="#8a8276">#FC8019 - the one accent</text>

    <!-- order -->
    <rect x="820" y="20" width="160" height="64" rx="12" fill="#FFB070"/>
    <text x="820" y="106" font-size="12" letter-spacing="1.5" fill="#f5efe7">ORDER</text>
    <text x="820" y="122" font-size="10" fill="#8a8276">#FFB070 - scout mode</text>

    <!-- dine -->
    <rect x="1020" y="20" width="160" height="64" rx="12" fill="#6FD8C8"/>
    <text x="1020" y="106" font-size="12" letter-spacing="1.5" fill="#f5efe7">DINE</text>
    <text x="1020" y="122" font-size="10" fill="#8a8276">#6FD8C8 - negotiator mode</text>
  </g>
</svg>
